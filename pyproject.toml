[project]
name = "crowley"
version = "0.1.0"
description = "Auction house data platform and addon for WoW Forever"
readme = "README.md"
authors = [
    { name = "Kyle DeProw", email = "kydepro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "pillow>=11.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
crowley-server = "crowley.server.__main__:main"
crowley-companion = "crowley.companion.__main__:main"
crowley-watchlist = "crowley.core.watchlist:main"
crowley-session = "crowley.session.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lupa>=2.8",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
