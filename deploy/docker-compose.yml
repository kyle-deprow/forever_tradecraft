name: crowley

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: crowley
      POSTGRES_PASSWORD: ${CROWLEY_DB_PASSWORD:-crowley}
      POSTGRES_DB: crowley
    volumes:
      - crowley-db:/var/lib/postgresql/data
    ports:
      # Localhost only; the API is the only thing exposed over Tailscale.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowley -d crowley"]
      interval: 5s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CROWLEY_DATABASE_URL: postgresql://crowley:${CROWLEY_DB_PASSWORD:-crowley}@db:5432/crowley
      CROWLEY_API_TOKEN: ${CROWLEY_API_TOKEN:?set CROWLEY_API_TOKEN in deploy/.env}
      CROWLEY_DATA_DIR: /data
      CROWLEY_HOST: 0.0.0.0
      CROWLEY_PORT: "8080"
    volumes:
      - crowley-raw:/data
    ports:
      # Default: reachable from this machine only. To serve the game over Tailscale, set
      # CROWLEY_BIND to this machine's Tailscale IP (tailscale ip -4) in deploy/.env.
      - "${CROWLEY_BIND:-127.0.0.1}:8080:8080"

volumes:
  crowley-db:
  crowley-raw:
